<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Koyu Titanyum Gradyanı -->
    <linearGradient id="mtDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Zengin Otomotiv Altın / Amber Gradyanı -->
    <linearGradient id="mtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Fasetik Açık Altın (Işık Yansıması) -->
    <linearGradient id="mtGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Fasetik Koyu Altın (Gölge) -->
    <linearGradient id="mtGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Krom / Titanyum Metalik Gradyan -->
    <linearGradient id="mtChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Elektrik Mavisi LED Işıma Gradyanı -->
    <linearGradient id="mtCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Amber Neon Işıma Filtresi -->
    <filter id="mtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>

    <!-- Metalik Zemin Gölgesi -->
    <filter id="mtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ==============================================
       1. DIŞ KALKAN (AERODİNAMİK OTOMOBİL ROZETİ)
  ============================================== -->
  <!-- Arka Plan Kalkanı -->
  <path d="M 256 18 
           C 264 18, 272 22, 277 26 
           L 466 128 
           C 475 133, 480 142, 480 152 
           L 480 348 
           C 480 358, 474 368, 466 373 
           L 277 486 
           C 264 494, 248 494, 235 486 
           L 46 373 
           C 38 368, 32 358, 32 348 
           L 32 152 
           C 32 142, 37 133, 46 128 
           L 235 26 
           C 240 22, 248 18, 256 18 Z" 
        fill="url(#mtDarkBg)" 
        stroke="url(#mtGold)" 
        stroke-width="5" 
        filter="url(#mtShadow)"/>

  <!-- İç Karbon Doku Çerçevesi -->
  <path d="M 256 38 
           L 450 142 
           L 450 338 
           L 256 464 
           L 62 338 
           L 62 142 Z" 
        fill="#0D131F" 
        stroke="rgba(255,255,255,0.08)" 
        stroke-width="2"/>

  <!-- İç İnce Amber Çizgisi (Neon LED Hat) -->
  <path d="M 256 50 
           L 438 148 
           L 438 332 
           L 256 450 
           L 74 332 
           L 74 148 Z" 
        fill="none" 
        stroke="url(#mtGold)" 
        stroke-width="2.5" 
        opacity="0.4"/>

  <!-- Altın Köşe Vurguları (Spor Otomobil Şasi Çizgileri) -->
  <path d="M 256 38 L 290 60 L 222 60 Z" fill="url(#mtGold)"/>
  <path d="M 256 464 L 230 442 L 282 442 Z" fill="url(#mtGold)"/>

  <!-- ==============================================
       2. LOGO MERKEZİ: SÜPER SPOR ARAÇ VE TAMİRCİ ANAHTARI
  ============================================== -->
  <g filter="url(#mtGlow)">
    <!-- Çapraz Hassas Usta Anahtarı (Krom & Çelik Alaşım) -->
    <!-- Anahtar Kolu -->
    <path d="M 185 345 L 305 185 L 335 208 L 215 368 Z" fill="url(#mtChrome)"/>
    <!-- Anahtar Kolu İç Kanalı -->
    <path d="M 205 330 L 295 210" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

    <!-- Anahtar Ağzı (Üst Sağ Başlık) -->
    <path d="M 305 185 
             C 295 170, 295 145, 310 130 
             C 325 115, 350 115, 365 130 
             C 375 140, 380 155, 375 170 
             L 410 200 
             C 416 205, 414 216, 406 220 
             L 380 232 
             C 372 236, 362 232, 358 224 
             L 348 205 
             L 335 208 Z" 
          fill="url(#mtChrome)"/>
    <!-- Anahtar Açık Ağız Boşluğu -->
    <path d="M 330 148 L 358 172 L 342 192 L 316 168 Z" fill="#0B0F17"/>

    <!-- ==============================================
         3. SÜPER SPOR OTOMOBİL ÖN SİLÜETİ (ALTIN KANAT)
    ============================================== -->
    <!-- Otomobil Tavanı ve Ön Kaputu -->
    <path d="M 130 260 
             C 150 205, 210 170, 275 170 
             C 305 170, 325 178, 345 190 
             C 320 198, 295 215, 280 235 
             C 255 210, 205 210, 175 240 
             L 130 260 Z" 
          fill="url(#mtGoldLight)"/>

    <!-- Otomobil Ön Tamponu ve Aerodinamik Gövde -->
    <path d="M 115 285 
             C 125 255, 160 235, 210 235 
             L 280 235 
             C 310 235, 335 250, 345 270 
             L 330 290 
             C 305 280, 270 275, 240 275 
             C 195 275, 150 282, 125 300 
             Z" 
          fill="url(#mtGold)"/>

    <!-- Ön LED Farlar (Elektrik Mavisi) -->
    <polygon points="145,268 175,262 165,274 140,274" fill="url(#mtCyanGlow)"/>
    <polygon points="275,260 305,265 298,272 272,268" fill="url(#mtCyanGlow)"/>

    <!-- ==============================================
         4. MERKEZİ DİNAMİK "M" MONOGRAMI (MOBİL TAMİRCİM)
    ============================================== -->
    <!-- Sol Bacak -->
    <path d="M 155 385 L 180 305 L 210 305 L 185 385 Z" fill="url(#mtGoldLight)"/>
    <!-- Sol İç V Faset -->
    <path d="M 210 305 L 256 365 L 235 385 L 185 385 Z" fill="url(#mtGoldDark)"/>
    <!-- Sağ İç V Faset -->
    <path d="M 256 365 L 302 305 L 327 385 L 277 385 Z" fill="url(#mtGoldLight)"/>
    <!-- Sağ Bacak -->
    <path d="M 302 305 L 332 305 L 357 385 L 327 385 Z" fill="url(#mtGold)"/>

    <!-- M Harfinin Ortasındaki Dinamik Altın Enerji Oku (Hız & Çeviklik) -->
    <polygon points="256,325 280,360 256,380 232,360" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- ==============================================
       5. ALT LOGOTİP: "MOBİL TAMİRCİM" METNİ
  ============================================== -->
  <text x="256" y="428" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="25" 
        letter-spacing="5" 
        fill="#FFFFFF">MOBİL</text>
        
  <text x="256" y="450" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-weight="800" 
        font-size="14" 
        letter-spacing="7" 
        fill="url(#mtGold)">TAMİRCİM</text>
</svg>
