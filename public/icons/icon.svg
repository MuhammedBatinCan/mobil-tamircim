<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kart -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#amberGrad)" stroke-width="6" opacity="0.3"/>

  <!-- Logo Sembolü: Otomobil & Tamirci Anahtarı -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Çapraz İngiliz Anahtarı -->
    <path d="M 330 145 C 315 130 290 130 275 145 L 255 165 C 248 172 250 185 260 190 L 285 202 L 180 307 C 170 317 170 333 180 343 L 195 358 C 205 368 221 368 231 358 L 336 253 L 348 278 C 353 288 366 290 373 283 L 393 263 C 408 248 408 223 393 208 L 375 190 C 385 170 375 140 350 135 L 340 155 L 325 155 L 315 145 Z" fill="url(#amberGrad)"/>

    <!-- Spor Araba Silüeti -->
    <path d="M 90 355 C 90 340 100 330 115 325 L 175 305 C 195 270 230 250 280 250 L 345 250 C 375 250 405 270 425 295 L 450 325 C 465 330 475 340 475 355 L 475 385 C 475 395 465 400 455 400 L 440 400 C 435 375 410 355 380 355 C 350 355 325 375 320 400 L 210 400 C 205 375 180 355 150 355 C 120 355 95 375 90 400 L 75 400 C 65 400 55 395 55 385 L 55 365 C 55 355 70 355 90 355 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Ön & Arka Tekerlekler -->
    <circle cx="150" cy="395" r="32" fill="#0F172A" stroke="url(#amberGrad)" stroke-width="8"/>
    <circle cx="150" cy="395" r="14" fill="url(#amberGrad)"/>
    <circle cx="380" cy="395" r="32" fill="#0F172A" stroke="url(#amberGrad)" stroke-width="8"/>
    <circle cx="380" cy="395" r="14" fill="url(#amberGrad)"/>

    <!-- Far Işığı Hüzmesi -->
    <polygon points="460,335 500,345 495,370 455,360" fill="url(#amberGrad)" opacity="0.8"/>
  </g>

  <!-- Alt Metin -->
  <text x="256" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#F59E0B">MOBİL TAMİRCİM</text>
</svg>
