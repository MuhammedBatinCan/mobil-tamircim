<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#181E2E"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#EF4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kart -->
  <rect width="512" height="512" rx="112" fill="url(#adminBgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#redGrad)" stroke-width="6" opacity="0.35"/>

  <!-- Logo Sembolü: Güvenlik Kalkanı & Dişli / Anahtar -->
  <g filter="url(#adminGlow)" transform="translate(0, -10)">
    <!-- Büyük Kalkan -->
    <path d="M 256 90 L 390 145 C 390 270 330 360 256 405 C 182 360 122 270 122 145 Z" fill="url(#redGrad)"/>

    <!-- İç Kalkan Konturu -->
    <path d="M 256 120 L 360 165 C 360 260 310 335 256 375 C 202 335 152 260 152 165 Z" fill="#0B0F19"/>

    <!-- Kalkan Ortası: Yıldız & Güvenlik Kilidi -->
    <path d="M 256 175 L 273 226 L 327 226 L 283 258 L 300 309 L 256 277 L 212 309 L 229 258 L 185 226 L 239 226 Z" fill="url(#redGrad)"/>
    <circle cx="256" cy="245" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Alt Metin -->
  <text x="256" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#EF4444">MOBİL ADMIN</text>
</svg>
